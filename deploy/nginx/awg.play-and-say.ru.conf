server {
    listen 80;
    listen [::]:80;
    server_name awg.play-and-say.ru;

    location / {
        return 301 https://awg.play-and-say.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name awg.play-and-say.ru;

    ssl_certificate /etc/letsencrypt/live/awg.play-and-say.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/awg.play-and-say.ru/privkey.pem;

    client_max_body_size 256k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host awg.play-and-say.ru;
        proxy_set_header X-Forwarded-Host awg.play-and-say.ru;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
