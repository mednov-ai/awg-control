name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: v1-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm check
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: bash -n scripts/*.sh

  helper:
    runs-on: ubuntu-24.04
    needs: verify
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: Build, checksum, SBOM, and sign Helper
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p release
          CGO_ENABLED=0 GOOS=linux GOARCH="$ARCH" go build -trimpath \
            -ldflags "-s -w -X github.com/mednov-ai/awg-control/internal/version.Version=${VERSION#v}" \
            -o "release/awgctl-linux-$ARCH" ./cmd/awgctl
          sha256sum "release/awgctl-linux-$ARCH" > "release/awgctl-linux-$ARCH.sha256"
          syft "file:release/awgctl-linux-$ARCH" -o spdx-json="release/awgctl-linux-$ARCH.spdx.json"
          cosign sign-blob --yes --bundle "release/awgctl-linux-$ARCH.sigstore.json" "release/awgctl-linux-$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: helper-${{ matrix.arch }}
          path: release/*

  panel:
    runs-on: ubuntu-24.04
    needs: verify
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/mednov-ai/awg-control:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/mednov-ai/awg-control@${{ steps.build.outputs.digest }}

  publish:
    runs-on: ubuntu-24.04
    needs: [helper, panel]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: helper-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
